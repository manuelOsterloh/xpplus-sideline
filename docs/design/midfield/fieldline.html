ecap:round;stroke-linejoin:round}.types [aria-pressed=true],.presets [aria-pressed=true]{background:var(--citron);border:2px solid var(--pine);color:var(--pine)}.roster button{min-height:72px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px}.roster strong{font:700 28px var(--sport)}.roster [aria-pressed=true]{background:var(--pine);color:#fffdf0;border:2px solid var(--pine)}.yardbox{border:1px solid var(--line);border-radius:12px;background:#e9eadc;padding:13px 15px;display:flex;flex-direction:column;justify-content:space-between}.yardhead,.adjust{display:flex;align-items:center;justify-content:space-between}.yardhead{font-size:14px;font-weight:700}.adjust{gap:8px}.adjust button{width:64px;font:700 28px var(--sport)}.adjust output{font:700 54px/1.1 var(--sport);letter-spacing:-1px;font-variant-numeric:tabular-nums}.adjust small{font:700 13px var(--sans);letter-spacing:0;margin-left:6px;color:var(--muted)}.presets{grid-template-columns:repeat(4,1fr)}.presets button{font-weight:700}.commit{margin-top:16px;padding:10px 10px 10px 17px;background:var(--pine);border-radius:12px;color:var(--white);display:flex;align-items:center;justify-content:space-between;gap:10px}.commit .micro{color:#c6d8c9}.commit strong{display:block;font:700 24px/1.2 var(--sport)}.commit button{background:var(--citron);color:var(--pine);border:0;padding:0 24px;min-height:58px;font-weight:700}.commit button span{margin-left:16px}.history{border-block:1px solid var(--line);padding:20px 0;display:grid;gap:12px}.history p{margin:0}.history button{justify-self:start;padding:0 18px;font-weight:700}.notice{padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--white)}.notice strong{display:block;font:700 30px var(--sport)}.notice p{margin:6px 0;color:var(--muted)}.pitch svg text{font-family:var(--sport);font-weight:700}.fieldyard{fill:#c4d7b9;font-size:22px}.bottom{display:flex;justify-content:space-between;gap:10px;padding:11px 0 0;color:var(--muted);font-size:12px}.bottom span:last-child{font-weight:700}
@media(min-width:1100px){.mast{height:84px}.pitch{min-height:170px}.types button{min-height:68px}.roster button{min-height:84px}.score-a{padding:23px 28px}.points{font-size:72px}.sub h1{font-size:39px}.commit{margin-top:20px}}
@media(max-width:850px){.grid{grid-template-columns:1fr 0.86fr;gap:12px}.roster button{flex-direction:column;align-items:center;gap:0}.types button{flex-direction:column;gap:3px;font-size:15px}.situation{gap:12px}.situation>div+div{padding-left:12px}.situation .s-label{font-size:10px}.points{font-size:52px}.teams{gap:10px}.session{margin-left:0}}
@media(max-width:680px){.page{padding:0 14px 16px}.mast{height:auto;min-height:64px}.brand{font-size:27px}.mark{width:28px;height:24px}.mast nav{gap:0}.mast nav button{padding:0 9px;font-size:14px}.session{display:none}.score{grid-template-columns:1fr}.pitch{min-height:105px;border-top:1px solid #597a68;border-left:0}.score-a{padding:14px 18px}.teams{margin:1px 0}.points{font-size:46px}.score-a .micro{font-size:10px}.situation{justify-content:space-between}.situation .s-label{display:block;margin-bottom:4px}.situation strong{font-size:21px}.grid{grid-template-columns:1fr}.types button{flex-direction:row;gap:6px}.roster button{min-height:60px;flex-direction:row;gap:4px}.yardbox{gap:7px}.adjust{justify-content:center;gap:26px}.commit{position:sticky;bottom:6px}.commit button{padding:0 12px}.commit strong{font-size:20px}.bottom span:last-child{display:none}.sub h1{font-size:30px}}
@media(min-width:851px) and (min-height:700px){.mast{height:82px}.pitch{min-height:164px}.score-a{display:flex;flex-direction:column;justify-content:center}.teams{margin:8px 0}.points{font-size:68px}.types button{min-height:68px}.roster button{min-height:88px}.situation{padding-block:19px}header.sub{margin:21px 0 15px}.adjust output{font-size:62px}.commit{margin-top:20px}.commit button{min-height:64px}}
</style></head><body><div class="page">
<header class="mast"><div class="brand"><span class="mark" aria-hidden="true"></span>MIDFIELD</div><nav aria-label="Ansicht"><button id="entryTab" aria-current="page">Erfassen</button><button id="logTab">Verlauf</button></nav><div class="session">Demospiel</div></header>
<section class="score" aria-label="Spielstand"><div class="score-a"><span class="micro">Düsseldorf gegen Köln</span><div class="teams"><span class="team">DUS</span><b class="points">14</b><span class="colon">:</span><b class="points away">7</b><span class="team away">CGN</span></div><div class="clock"><span>Q1</span><i></i><span>04:12</span><i></i><span class="off">DUS am Ball →</span></div></div>
<div class="pitch"><svg viewBox="0 0 460 150" preserveAspectRatio="none" aria-label="Feldausschnitt mit Ballposition und First-Down-Linie" role="img"><defs><pattern id="turf" width="92" height="150" patternUnits="userSpaceOnUse"><rect width="46" height="150" fill="#ffffff" opacity=".025"/><path d="M0 0V150" stroke="#b4cea9" stroke-width="2" opacity=".6"/><path d="M0 46v8m9.2 -8v8m9.2 -8v8m9.2 -8v8m9.2 -8v8m9.2 -8v8m9.2 -8v8m9.2 -8v8m9.2 -8v8m9.2 -8v8M0 96v8m9.2 -8v8m9.2 -8v8m9.2 -8v8m9.2 -8v8m9.2 -8v8m9.2 -8v8m9.2 -8v8m9.2 -8v8m9.2 -8v8" stroke="#bdd1b6" opacity=".65"/></pattern></defs><rect width="100%" height="100%" fill="url(#turf)"/><g class="fieldyard" text-anchor="middle"><text x="92" y="136">40</text><text x="184" y="136">50</text><text x="276" y="136">40</text><text x="368" y="136">30</text></g><line id="firstLine" x1="248.4" x2="248.4" y1="0" y2="150" stroke="#ecb65a" stroke-width="3" stroke-dasharray="6 4"/><g id="ball" transform="translate(202.4 0)"><line y1="0" y2="150" stroke="#d9ef85" stroke-width="2"/><circle cy="76" r="13" fill="#def477" stroke="#143e31" stroke-width="4"/><path d="m-4 71 6 5-6 5" stroke="#143e31" stroke-width="3" fill="none"/></g></svg><span class="fieldtag">BALLPOSITION</span></div></section>
<div class="situation"><div><span class="micro s-label">Down</span><strong id="down">2nd &amp; 5</strong></div><div><span class="micro s-label">Spot</span><strong id="spot">OPP 48</strong></div><div><span class="micro s-label">Angriff</span><strong>Düsseldorf</strong></div></div>
<main><div id="entry"><header class="sub"><h1>Spielzug erfassen</h1><span class="micro">Offense</span></header><div id="form" class="grid"><div class="left"><section><div class="eyeline">Spielzug</div><div class="types"><button data-play="Lauf" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 17h5l8-10h5m-5 0h5v5"/></svg>Lauf</button><button data-play="Pass" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 19c6-2 5-12 16-13m-5-2 6 2-3 6"/></svg>Pass</button><button data-play="Sack" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m4 6 13 12m-5 0h5v-5M5 18 17 6"/></svg>Sack</button></div></section><section><div class="eyeline" id="playerLabel">Ballträger</div><div class="roster" id="players"></div></section></div><section class="yardbox"><div class="yardhead">Raumgewinn</div><div class="adjust"><button id="minus" aria-label="Ein Yard weniger">−</button><output id="yards">+5</output><button id="plus" aria-label="Ein Yard mehr">+</button></div><div class="presets" id="presets"></div></section></div><section class="notice" id="notice" hidden><strong>Spielzug gespeichert</strong><p id="savedText"></p></section><div class="commit"><div><span class="micro" id="nextTitle">Danach</span><strong id="next" aria-live="polite">1st &amp; 10 · OPP 43</strong></div><button id="save">Speichern <span aria-hidden="true">→</span></button></div></div><div hidden id="log"><header class="sub"><h1>Verlauf</h1></header><div class="history"><p id="historyText"></p><button id="toEntry">Zur Erfassung</button></div></div></main></div>
<script>
const $=id=>document.getElementById(id);
const choices={Lauf:[['22','Fischer'],['12','Weber'],['81','Schneider']],Pass:[['81','Schneider'],['11','Wagner'],['22','Fischer']],Sack:[['12','Weber']]};
let play='Lauf',player=0,yards=5,saved='';
function next(){const end=52+yards;return {down:yards>=5?'1st & 10':'3rd & '+(5-yards),spot:end===50?'50':end>50?'OPP '+(100-end):'OWN '+end};}
function showEntry(active){$('entry').hidden=!active;$('log').hidden=active;$('entryTab').toggleAttribute('aria-current',active);$('logTab').toggleAttribute('aria-current',!active);(active?$('entryTab'):$('logTab')).setAttribute('aria-current','page');$('historyText').textContent=saved||'Noch kein Spielzug in diesem Entwurf gespeichert.';}
function pickButtons(id,items,handler){const parent=$(id);parent.replaceChildren();items.forEach((item,index)=>{const btn=document.createElement('button');btn.innerHTML=item;btn.onclick=()=>handler(index);parent.append(btn);});}
function controls(){document.querySelectorAll('[data-play]').forEach(b=>b.setAttribute('aria-pressed',String(play===b.dataset.play)));$('playerLabel').textContent=({Lauf:'Ballträger',Pass:'Receiver · Pass komplett',Sack:'Quarterback'})[play];pickButtons('players',choices[play].map(p=>'<strong>#'+p[0]+'</strong>'+p[1]),i=>{player=i;render()});const presets=play==='Sack'?[-1,-3,-5,-10]:[0,3,5,10];pickButtons('presets',presets.map(format),i=>{yards=presets[i];render()});render();}
function format(n){return n>0?'+'+n:String(n);}
function render(){const n=next();$('next').textContent=n.down+' · '+n.spot;$('yards').innerHTML=format(yards)+'<small>Yds</small>';[...$('players').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===player)));[...$('presets').children].forEach(b=>b.setAttribute('aria-pressed',String(Number(b.textContent)===yards)));$('minus').disabled=yards<=-10;$('plus').disabled=yards>=(play==='Sack'?0:20);}
function restore(){play='Lauf';player=0;yards=5;saved='';$('form').hidden=false;$('notice').hidden=true;$('save').innerHTML='Speichern <span aria-hidden="true">→</span>';$('nextTitle').textContent='Danach';$('down').textContent='2nd & 5';$('spot').textContent='OPP 48';field(52,57);controls();}
function field(at,to){$('ball').setAttribute('transform','translate('+(184+(at-50)*9.2)+' 0)');['x1','x2'].forEach(attr=>$('firstLine').setAttribute(attr,184+(to-50)*9.2));}
$('save').onclick=()=>{if(saved){restore();return}const n=next(),p=choices[play][player];saved=play+' · #'+p[0]+' '+p[1]+' · '+format(yards)+' Yds';$('savedText').textContent=saved;$('form').hidden=true;$('notice').hidden=false;$('save').textContent='Demo neu starten';$('nextTitle').textContent='Aktuelle Situation';$('down').textContent=n.down;$('spot').textContent=n.spot;field(52+yards,yards>=5?62+yards:57);};
$('minus').onclick=()=>{yards--;render()};$('plus').onclick=()=>{yards++;render()};document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{play=b.dataset.play;player=0;yards=({Lauf:5,Pass:10,Sack:-3})[play];controls();});$('entryTab').onclick=$('toEntry').onclick=()=>showEntry(true);$('logTab').onclick=()=>showEntry(false);restore();
</script></body></html>
