<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIDFIELD · Call Sheet</title>
<style>
*{box-sizing:border-box}html{background:#eae6d9;color:#202e49;font-family:"Avenir Next",system-ui,sans-serif}body{margin:0;--ink:#223853;--red:#ac392b;--paper:#faf7ed;--line:#b8b9aa}header{height:68px;padding:0 4%;background:var(--ink);color:#fffaf0;display:flex;align-items:center;justify-content:space-between}header b{letter-spacing:-.07em;font-size:29px;font-weight:950;font-style:italic}header span{font-size:15px;font-weight:650}i{display:inline-block;background:#c8ddb3;border-radius:50%;width:9px;height:9px;margin-right:8px}main{max-width:1180px;margin:auto;padding:22px 4%}.top{display:flex;align-items:end;justify-content:space-between;border-bottom:3px double var(--ink);padding-bottom:12px;gap:12px}.top h1{font:italic bold clamp(34px,5vw,55px)/1 Georgia,serif;letter-spacing:-.055em;margin:0}.score{font-size:20px;font-weight:800;word-spacing:3px}.score b{font-size:28px}.situation{display:flex;flex-wrap:wrap;gap:8px 30px;padding:13px 0 20px}.situation span{font:600 14px/1.4 ui-monospace,monospace}.sheet{display:grid;grid-template-columns: minmax(0,1.75fr) minmax(200px,1fr);background:var(--paper);border:1px solid #b6b4a7;box-shadow:3px 4px 0 #c8c5b7}.left{padding:24px 28px}.tabs{display:flex;gap:6px}.tabs button{flex:1;border:1px solid var(--line);background:transparent;border-radius:5px;color:var(--ink)}button{font:inherit;font-weight:720;min-height:54px;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #0079aa;outline-offset:2px}.tabs button[aria-current=step]{background:var(--ink);color:white;border-color:var(--ink)}.label{font:700 12px/1.4 ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase}.block{min-height:236px}h2{font:600 30px Georgia,serif;letter-spacing:-.03em;margin:26px 0 12px}.opts{display:grid;grid-template-columns: repeat(2,1fr);gap:10px}.opt{min-height:88px;padding:12px 16px;border:2px solid var(--ink);background:#fffdf7;color:var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:space-between;font-size:21px}.opt small{font-size:14px}.opt svg{height:44px;width:60px}.opt[aria-pressed=true]{background:#e1e8ed;border-color:var(--ink);box-shadow:inset 0 -4px var(--ink)}.opt[aria-pressed=true]:after{content:'✓';font-size:18px}.yards{grid-template-columns:repeat(3,1fr)}.yards .opt{justify-content:center;gap:4px;min-height:70px}.current{margin-top:15px;font-size:15px}.primary{width:100%;display:flex;align-items:center;justify-content:space-between;color:#fff;background:var(--red);border:none;border-radius:5px;padding:0 20px;font-size:19px;min-height:61px}.primary span{font-size:24px}.record{padding:25px 22px;border-left:2px dashed #a9ad9f;background:repeating-linear-gradient(to bottom,transparent 0 31px,#828f9b22 31px 32px),#f2eedf}.record h3{font:italic 600 27px Georgia,serif;margin:13px 0}.record dl{margin:2px 0 12px}.record dl div{display:flex;justify-content:space-between;align-items:center;min-height:45px;gap:8px}.record dt{font-size:14px}.record dd{font-weight:800;margin:0}.next{border:2px solid var(--red);color:#973c2c;border-radius:3px;display:inline-block;padding:7px 10px;transform:rotate(-2deg);font:700 17px ui-monospace,monospace}.history{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 1px;color:#3d4960;font-size:14px}.history button{background:transparent;color:var(--ink);border:1px solid var(--ink);padding:0 12px;border-radius:5px}.history button:disabled{visibility:hidden}.notes{font:italic 15px Georgia,serif}.draw{stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.4}.saved{color:var(--red);font-weight:bold}
@media(max-width:790px){.left{padding:20px 16px}.record{padding:22px 14px}.sheet{grid-template-columns:1.75fr 1fr}.tabs button{font-size:14px}.opt{padding:9px}}
@media(max-width:620px){header{height:56px}.top{align-items:start;flex-wrap:wrap}.sheet{display:block}.left{padding:16px}.record{border:0;border-top:2px dashed #a9ad9f}.record h3,.notes{display:none}.record dl{display:flex;gap:10px;flex-wrap:wrap}.record dl div{display:block}.block{min-height:195px}.situation{gap:5px 14px}}
</style><body><header><b>MIDFIELD</b><span><i></i>Demo · lokal</span></header><main><div class="top"><h1>Call Sheet</h1><div class="score">DUS <b>14 : 7</b> CGN</div></div><div class="situation"><span>Q1 · 04:12</span><span id="down"></span><span id="spot"></span><span>DUS Offense</span></div><div class="sheet"><div class="left"><nav class="tabs" aria-label="Eingabeschritte"></nav><section class="block"><h2 id="question"></h2><div id="options" class="opts"></div><p class="current" id="helper"></p></section><button class="primary" id="action"></button></div><aside class="record"><div class="label">Spielprotokoll</div><h3 id="playnum"></h3><dl><div><dt>Spielzug</dt><dd id="type"></dd></div><div><dt id="who"></dt><dd id="player"></dd></div><div><dt>Raumgewinn</dt><dd id="gain"></dd></div></dl><p class="notes">Danach auf dem Feld</p><strong class="next" id="next"></strong></aside></div><div class="history"><span role="status" id="status">Entwurf · bereit zur Eingabe</span><button id="reset" disabled>Zurücksetzen</button></div></main>
<script>
const el=id=>document.getElementById(id),steps=['Spielzug','Spieler','Yards'],names=['#22 Fischer','#12 Weber','#81 Schneider'];
let step=0,kind='Lauf',player=names[0],gain=5,spot=48,distance=5,down=2,count=0,ended=false;
function diagram(pass){return '<svg class="draw" aria-hidden="true" viewBox="0 0 64 44"><circle cx="8" cy="36" r="4"/><path d="'+(pass?'M15 32L48 10M38 10h12v12':'M15 36h12V12h22M42 5l8 7-8 7')+'"/></svg>'}
function result(){let pos=Math.max(0,spot-gain);let first=gain>=distance;return {pos,dist:first?Math.min(10,pos):distance-gain,d:first?1:down+1,label:pos===0?'Touchdown':(!first && down===4?'Ballwechsel':(first?'1st Down':(down+1)+'. & '+(distance-gain))+' · OPP '+pos)}}
function render(){let r=result();el('down').textContent=down+'. & '+distance;el('spot').textContent='OPP '+spot;document.querySelector('nav').replaceChildren(...steps.map((s,i)=>{let b=document.createElement('button');b.textContent=(i+1)+' '+s;b.setAttribute('aria-current',i===step?'step':'false');b.onclick=()=>{if(!ended){step=i;render()}};b.disabled=ended;return b}));el('question').textContent=ended?'Spielzug gespeichert': ['Welcher Spielzug?','Wer trägt den Ball?','Wie viele Yards?'][step];if(!ended && step===1 && kind==='Pass')el('question').textContent='Wer fängt den Pass?';let list=step===0?['Lauf','Pass']:step===1?names:[-2,0,1,3,5,10];el('options').className='opts '+(step===2?'yards':'');el('options').replaceChildren(...(ended?[]:list).map(v=>{let b=document.createElement('button');b.className='opt';b.setAttribute('aria-pressed',String(v===[kind,player,gain][step]));b.textContent=typeof v==='number'?(v>0?'+':'')+v:v;if(step===0)b.insertAdjacentHTML('afterbegin',diagram(v==='Pass'));b.onclick=()=>{if(step===0){kind=v;player=v==='Pass'?names[2]:names[0]}else if(step===1)player=v;else gain=v;render()};return b}));el('type').textContent=kind;el('player').textContent=player;el('who').textContent=kind==='Pass'?'Receiver':'Ballträger';el('gain').textContent=(gain>0?'+':'')+gain+' Yds';if(!ended)el('next').textContent=r.label;el('helper').textContent=ended?'Der Spielzug steht im lokalen Musterprotokoll.':'';el('action').innerHTML=(ended?'Erneut testen':step===2?'Speichern':'Weiter')+'<span aria-hidden="true">'+(step===2&&!ended?'✓':'→')+'</span>';el('playnum').textContent='Play '+String(31+count).padStart(2,'0')}
function reset(){step=0;kind='Lauf';player=names[0];gain=5;spot=48;down=2;distance=5;count=0;ended=false;el('status').textContent='Entwurf · bereit zur Eingabe';el('reset').disabled=true;render()}
el('action').onclick=()=>{if(ended)return reset();if(step<2){step++;render();return}let r=result();el('status').textContent='Gespeichert · '+kind+' · '+player+' · '+el('gain').textContent;ended=true;el('reset').disabled=false;spot=r.pos;distance=r.dist;down=r.d;render()};el('reset').onclick=reset;render();
</script></body></html>
