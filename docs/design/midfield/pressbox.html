<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIDFIELD · Pressbox</title>
<style>
:root{--club-primary:#252721;--club-secondary:#ff793d;--club-accent:#f6efdc;--ink:var(--club-primary);--paper:var(--club-accent);--hot:var(--club-secondary);--white:#fffcf3;--line:#c6beac;--muted:#58594e;--display:"Arial Narrow","Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#ded7c6}
*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-weight:700}button:focus-visible{outline:3px solid #006cbd;outline-offset:3px}button:active{transform:translateY(2px)}button:disabled{opacity:.45;cursor:default}h1,h2,p{margin:0}
.shell{max-width:1280px;margin:auto;background:var(--paper);min-height:100svh;display:flex;flex-direction:column}
header{background:var(--ink);color:var(--white);display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid #585b4f;gap:12px}
.wordmark{font-family:var(--display);font-size:26px;line-height:1;font-weight:950;letter-spacing:-1.5px;font-style:italic;display:flex;align-items:center;gap:12px}.brandmark{height:22px;width:31px;display:block;background:repeating-linear-gradient(112deg,var(--hot) 0 5px,transparent 5px 8px);transform:skew(-8deg)}.status{font:700 12px var(--mono);display:flex;gap:9px;align-items:center;letter-spacing:.05em}.status:before{content:"";width:8px;height:8px;background:var(--hot);border-radius:50%}
.layout{display:grid;grid-template-columns:minmax(275px,.82fr) minmax(0,1.7fr);flex:1}.scorebox{background:var(--ink);color:var(--paper);padding:30px 25px 26px;display:flex;flex-direction:column;gap:22px}
.gamehead,.clock,.drivehead,.players,.types,.yardhead,.preset,.dock,.dockbuttons,.result,.context{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kicker,.clock,.role,.yardhead label{font:700 12px/1.25 var(--mono);letter-spacing:.085em;text-transform:uppercase}.scorebox .kicker{color:#c6c6b7}.gamehead{border-bottom:1px solid #575a4e;padding-bottom:14px}.clock{white-space:nowrap;color:var(--hot);letter-spacing:0;font-size:15px}
.teams{display:grid;gap:9px}.team{display:grid;grid-template-columns:1fr auto;align-items:center}.team strong{font-family:var(--display);font-size:clamp(34px,4vw,57px);font-weight:850;letter-spacing:-.055em;line-height:1}.team .score{font-family:var(--display);font-size:clamp(60px,7vw,92px);line-height:.91;font-weight:800;letter-spacing:-.075em;font-variant-numeric:tabular-nums}.team small{display:block;font-size:14px;margin-top:6px;color:#cccdbf}.team.home .score{color:var(--hot)}
.context{margin:5px 0 2px;padding:17px 0;border-block:1px solid #595c50}.context b{display:block;font:800 clamp(23px,2.7vw,36px)/1.15 var(--display);margin-top:6px;letter-spacing:-.05em}.possession{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px}.possession:before{content:"";background:var(--hot);width:13px;height:8px;border-radius:75% 18%;transform:rotate(-18deg)}
.field{position:relative;margin-top:14px;height:88px;border:1px solid #6f7361;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),#626654 calc(10% - 1px) 10%),#363b31;overflow:hidden}.field:before,.field:after{position:absolute;left:0;right:0;height:7px;content:"";background:repeating-linear-gradient(90deg,transparent 0 calc(2% - 1px),#989d87 calc(2% - 1px) 2%)}.field:before{top:22%}.field:after{bottom:22%}.numbers{position:absolute;display:flex;justify-content:space-around;inset:auto 0 4px;color:#c8cbb8;font:11px var(--mono)}.field .scrimmage,.field .goal{position:absolute;top:0;bottom:0;width:3px;z-index:1;background:var(--paper)}.field .goal{background:var(--hot)}.field .scrimmage:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--paper);position:absolute;left:-3px;top:42%;border:2px solid var(--ink)}.legend{display:flex;gap:16px;color:#e7e5d6;font-size:13px;margin-top:10px}.legend i{display:inline-block;height:10px;width:3px;background:var(--paper);margin-right:5px}.legend span:last-child i{background:var(--hot)}.record{margin-top:auto;padding-top:18px;border-top:1px solid #595c50}.record p{font-size:16px;line-height:1.35;font-weight:650;margin-top:7px}
.board{padding:26px clamp(20px,2.7vw,38px) 22px;display:flex;flex-direction:column;gap:21px;background:var(--paper)}h1{font-size:clamp(32px,4vw,52px);font-family:var(--display);line-height:1;font-weight:850;letter-spacing:-.065em}.groupname{font-weight:750;font-size:16px;line-height:1.3;margin:0 0 9px}.types button,.players button,.preset button,.unit button,.dock button{border:1.5px solid #a9a58f;background:var(--white);border-radius:7px;min-height:53px;box-shadow:0 2px 0 #bcb5a2}
.types,.players{gap:8px}.types button{font-size:20px;flex:1;min-width:0}.types button[aria-pressed=true],.players button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink);box-shadow:inset 0 -4px var(--hot)}.types button[aria-pressed=true]:before{content:"✓";font-size:16px;margin-right:7px;color:var(--hot)}
.players button{flex:1;min-width:0;text-align:left;padding:8px 12px;display:grid;grid-template-columns:min-content auto;gap:7px;align-items:center}.num{font:800 clamp(19px,2.1vw,27px)/1.15 var(--display);letter-spacing:-.05em}.name{font-size:14px}.players button[aria-pressed=true] .num{color:var(--hot)}
.yardpad{background:#e8dfc9;border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px}.yardhead{margin-bottom:10px}.yardhead label{color:var(--muted)}.yardrow{display:grid;grid-template-columns:minmax(125px,.75fr) minmax(220px,1.7fr);gap:16px}.unit{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:6px}.unit output{grid-column:1/-1;display:block;text-align:center;font:800 clamp(41px,5vw,61px)/.98 var(--display);letter-spacing:-.07em;font-variant-numeric:tabular-nums}.unit button{min-height:48px;font-size:23px;line-height:1}.preset{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.preset button{font:750 23px var(--mono);min-height:49px}.preset button[aria-pressed=true]{background:var(--hot);border-color:var(--ink);color:var(--ink);box-shadow:0 2px var(--ink)}.dock{margin-top:auto;align-items:flex-end;gap:12px;border-top:1px solid var(--line);padding-top:14px}.result{flex-direction:column;align-items:flex-start;gap:5px}.result strong{font-size:clamp(16px,1.7vw,22px);font-weight:800;letter-spacing:-.025em}.result small{font-size:14px;color:var(--muted)}.dockbuttons{gap:8px}.dock button{padding:0 14px;min-height:56px}.dock .save{display:flex;align-items:center;justify-content:center;gap:12px;padding:0 17px;border:2px solid var(--ink);background:var(--hot);font-size:17px;box-shadow:0 3px var(--ink)}.save span{font-size:24px}.dock .undo{width:55px;font-size:24px}
@media(min-width:900px) and (min-height:850px){.board{justify-content:center;gap:32px}.scorebox{gap:35px}.dock{margin-top:16px}.scorebox .field{height:115px}}
@media(max-width:840px){.layout{grid-template-columns:1fr}.scorebox{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;padding:17px 24px}.gamehead{grid-column:1/-1;padding-bottom:8px}.teams{grid-row:2/4;gap:5px}.team .score{font-size:45px}.team strong{font-size:28px}.team small{font-size:12px}.context{margin:0;padding:3px 0 10px;border-top:none}.context b{font-size:23px}.drive{align-self:end}.drivehead,.legend,.record{display:none}.field{margin:0;height:43px}.board{gap:17px;padding:22px 24px}.dock{margin-top:4px}}
@media(max-width:550px){header{padding:14px 16px}.scorebox,.board{padding-inline:16px}.scorebox{column-gap:14px}.context b{font-size:18px}.board{gap:17px}.players button{display:flex;flex-direction:column;align-items:flex-start;padding:8px;gap:1px}.yardrow{grid-template-columns:88px 1fr;gap:10px}.yardpad{padding:12px 10px}.dock button{padding:0 9px}.dock .save{padding:0 11px}.dock{align-items:center}.dock .undo{width:48px}.types button{font-size:17px}}
@media(min-width:841px) and (min-height:720px){.types button{min-height:64px}.players button{min-height:67px}.players .num{font-size:28px}.players .name{font-size:16px}.preset button{min-height:61px}.yardhead{margin-bottom:13px}.unit button{min-height:55px}.yardpad{padding-top:17px;padding-bottom:18px}}
</style>
</head>
<body>
<div class="shell">
<header><div class="wordmark"><i class="brandmark" aria-hidden="true"></i>MIDFIELD</div><div class="status">DEMOSPIEL</div></header>
<main class="layout">
<aside class="scorebox" aria-label="Spielstand und Situation">
<div class="gamehead"><span class="kicker">Spielstand</span><div class="clock">Q1 · 04:12</div></div>
<div class="teams"><div class="team home"><div><strong>DUS</strong><small>Düsseldorf Panther</small></div><b class="score">14</b></div><div class="team"><div><strong>CGN</strong><small>Cologne Crocodiles</small></div><b class="score">7</b></div></div>
<div class="context"><div><span class="kicker">Down</span><b id="down"></b></div><div><span class="kicker">Ball auf</span><b id="spot"></b></div></div>
<div class="drive"><div class="drivehead"><span class="possession">DUS am Ball</span></div><div class="field" aria-hidden="true"><i id="ball" class="scrimmage"></i><i id="line" class="goal"></i><div class="numbers"><span>10</span><span>30</span><span>50</span><span>30</span><span>10</span></div></div><div class="legend"><span><i></i>Ball</span><span><i></i>First Down</span></div></div>
<div class="record"><span class="kicker">Letzter Spielzug</span><p id="last">Lauf · #22 Fischer · +5 Yds</p></div>
</aside>
<section class="board" aria-labelledby="title"><h1 id="title">Spielzug erfassen</h1>
<section><h2 class="groupname">Spielzug</h2><div class="types" id="types"><button>Lauf</button><button>Pass</button><button>Sack</button></div></section>
<section><h2 class="groupname" id="who">Ballträger</h2><div class="players" id="players"></div></section>
<section class="yardpad"><div class="yardhead"><h2 class="groupname" style="margin:0">Raumgewinn</h2><label for="yards">Yards</label></div><div class="yardrow"><div class="unit"><output id="yards"></output><button id="minus" aria-label="Ein Yard weniger">−</button><button id="plus" aria-label="Ein Yard mehr">+</button></div><div class="preset" id="presets"></div></div></section>
<footer class="dock"><div class="result" aria-live="polite"><small id="hint">Nach diesem Play</small><strong id="next"></strong></div><div class="dockbuttons"><button title="Spielzug zurücknehmen" aria-label="Spielzug zurücknehmen" class="undo" id="undo">↶</button><button class="save" id="save">Speichern <span aria-hidden="true">↗</span></button></div></footer>
</section></main></div>
<script>
const byId=id=>document.getElementById(id);
const roster={Lauf:[[22,'Fischer'],[12,'Weber'],[81,'Schneider']],Pass:[[81,'Schneider'],[11,'Wagner'],[22,'Fischer']],Sack:[[12,'Weber'],[18,'Klein'],[7,'Schulz']]};
const original={pos:52,down:2,toGo:5};
let state={...original},play='Lauf',idx=0,yards=5,saved=null;
const spot=pos=>pos===50?'50':(pos>50?'OPP ':'OWN ')+(pos>50?100-pos:pos);
const signed=n=>n>0?'+'+n:String(n).replace('-','−');
function preview(){const pos=Math.max(1,Math.min(99,state.pos+yards));const first=pos-state.pos>=state.toGo;return {pos,down:first?1:state.down+1,toGo:first?Math.min(10,100-pos):state.toGo-(pos-state.pos)};}
function selectPlay(type){play=type;idx=0;yards=type==='Sack'?-3:5;render();}
function render(){
 byId('down').textContent=state.down+'. & '+state.toGo;byId('spot').textContent=spot(state.pos);
 byId('ball').style.left=state.pos+'%';byId('line').style.left=(state.pos+state.toGo)+'%';
 for(const b of byId('types').children){b.setAttribute('aria-pressed',b.textContent===play);b.disabled=!!saved;}
 byId('who').textContent=({Lauf:'Ballträger',Pass:'Receiver',Sack:'Quarterback'})[play];
 const buttons=byId('players').children;
 roster[play].forEach(([number,name],i)=>{const b=buttons[i];b.children[0].textContent='#'+number;b.children[1].textContent=name;b.setAttribute('aria-pressed',i===idx);b.disabled=!!saved;});
 byId('yards').textContent=signed(yards);
 for(const b of byId('presets').children){b.setAttribute('aria-pressed',+b.value===yards);b.disabled=!!saved||(play==='Sack'&&+b.value>0);}
 byId('minus').disabled=!!saved||yards<=-20;byId('plus').disabled=!!saved||yards>=(play==='Sack'?0:20);
 const next=saved?state:preview();
 byId('hint').textContent=saved?'Play erfasst':'Nach diesem Play';byId('next').textContent=(next.down===1?'1st Down':next.down+'. & '+next.toGo)+' · '+spot(next.pos);
 byId('save').innerHTML=saved?'Demo zurücksetzen':'Speichern <span aria-hidden="true">↗</span>';byId('undo').disabled=!saved;
 byId('last').textContent=saved?saved.label:'Lauf · #22 Fischer · +5 Yds';
}
for(const b of byId('types').children)b.onclick=()=>selectPlay(b.textContent);
for(let i=0;i<3;i++){const b=document.createElement('button');b.innerHTML='<span class="num"></span><span class="name"></span>';b.onclick=()=>{idx=i;render()};byId('players').append(b);}
for(const n of [-3,0,1,3,5,10]){const b=document.createElement('button');b.value=n;b.textContent=signed(n);b.onclick=()=>{yards=n;render()};byId('presets').append(b);}
byId('minus').onclick=()=>{yards--;render()};byId('plus').onclick=()=>{yards++;render()};
byId('save').onclick=()=>{if(saved){state={...original};saved=null;selectPlay('Lauf');return;}const [number,name]=roster[play][idx];saved={state:{...state},label:play+' · #'+number+' '+name+' · '+signed(yards)+' Yds'};state=preview();render();};
byId('undo').onclick=()=>{if(saved){state=saved.state;saved=null;render();}};
render();
</script></body></html>
